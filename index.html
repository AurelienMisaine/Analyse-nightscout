<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse Diabète</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="scripts/styles/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Analyse Nightscout 🩸</h1>
        
        <div class="config">
            <input type="text" id="nightscoutUrl"
                   placeholder="https://votre-instance-nightscout">
            <input type="password" id="apiToken"
                   placeholder="Votre API secret ou token reporter">
            <button onclick="loadData()">Actualiser</button>
        </div>

        <div id="loading">Chargement des données...</div>
        
        <div class="stats" id="stats"></div>
        
        <div class="charts">
            <div class="chart-container">
                <canvas id="glucoseChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="insulinChart"></canvas>
            </div>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
